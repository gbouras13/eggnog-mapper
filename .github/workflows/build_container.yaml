name: Build and Push Container to Quay
on: [push, pull_request]

# Don't queue duplicate builds for the same ref — the previous one wins.
concurrency:
  group: build-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The pawsey/pytorch:2.7.1-rocm6.3.3 base image is ~14GB compressed
      # and exceeds the ~14GB free disk on a fresh ubuntu-latest runner.
      # Without this step the very first ``FROM`` line dies with
      # ``ResourceExhausted: ... no space left on device``. The
      # ``free-disk-space`` action removes pre-installed toolchains we
      # don't use (Android SDK, .NET, Haskell GHC, large apt packages,
      # swap file, pre-pulled docker images), freeing ~25-30GB.
      # ``tool-cache: false`` keeps the runner's node/python toolcache
      # so other actions (checkout, docker login) still work fast.
      #
      # This image needs the headroom more than phold's does: it compiles
      # Foldseek from source in a builder stage on top of the same base.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Show free disk after cleanup
        run: df -h

      # Build BEFORE logging in. The image is worth validating even when it
      # cannot be published -- a fork pull_request gets no secrets, and a repo
      # that has not had QUAY_* set yet would otherwise fail at login and skip
      # the build entirely, reporting nothing about the Dockerfile.
      #
      # eggnog-mapper comes from the checked-out build context, so the image
      # always matches the commit that triggered it without a second fetch.
      # FOLDSEEK_REF is pinned separately: Victor-Mihaila/foldseek only has a
      # master branch, and the 12-state work lives there.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg FOLDSEEK_REF=master \
            -f container/hpci/Dockerfile -t eggnog-mapper-12st:${{ github.sha }} .

      # Publishing needs QUAY_USERNAME/QUAY_PASSWORD on *this* repo; secrets are
      # not shared between repositories. Without them the build above still
      # runs and this step is skipped with a notice rather than a red run.
      - name: Check Quay credentials
        id: quay
        if: github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.QUAY_USERNAME }}" ] && [ -n "${{ secrets.QUAY_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::QUAY_USERNAME/QUAY_PASSWORD are not set on this repository; image built but not pushed."
          fi

      - name: Log in to Quay
        if: steps.quay.outputs.available == 'true'
        run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Push Docker image
        if: steps.quay.outputs.available == 'true'
        run: |
          IMAGE=quay.io/${{ secrets.QUAY_USERNAME }}/eggnog-mapper-12st:${{ github.sha }}
          docker tag eggnog-mapper-12st:${{ github.sha }} $IMAGE
          docker push $IMAGE
